[package]
name = "taskwarrior-graph"
version = "0.1.0"
edition = "2024"

[dependencies]

iced= { version = "0.14", features = ["canvas"] }
iced_core = "0.14"
graphviz-rust = "0.9.8"
dot-generator = "0.2.0"
dot-structures = "0.1.2"
regex = "1.12.4"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
